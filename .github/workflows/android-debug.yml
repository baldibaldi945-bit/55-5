name: Android debug build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NDK_VERSION: 20.0.5594570
  CMAKE_VERSION: 3.10.2.4988404

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip and detect project folder
        run: |
          if [ -f PortYouStudio.zip ]; then
            unzip -q -o PortYouStudio.zip
          fi
          S=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name fetch-native-deps.sh -path '*/scripts/*' | head -n1)
          if [ -z "$S" ]; then
            echo "scripts/fetch-native-deps.sh not found. Repo layout:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -not -path '*/.git/*' | head -60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$(dirname "$S")")" >> "$GITHUB_ENV"

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install clean legacy Android SDK
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          curl -fsSL -o /tmp/sdk-tools.zip https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          unzip -q /tmp/sdk-tools.zip -d "$SDK_ROOT"
          SDKM="$SDK_ROOT/tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-28" "build-tools;28.0.3" "cmake;$CMAKE_VERSION" "ndk;$NDK_VERSION"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Gradle 4.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '4.6'

      - name: Fetch native and audio dependencies
        run: |
          sh "$PROJECT_DIR/scripts/fetch-native-deps.sh"
          sh "$PROJECT_DIR/scripts/fetch-codecs.sh"

      - name: Sync Android assets
        run: sh "$PROJECT_DIR/scripts/sync-android-assets.sh"

      - name: Patch project (minSdk 21, no transitive deps for 7-Zip)
        run: |
          F="$PROJECT_DIR/android/app/build.gradle"
          M="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          sed -i 's/minSdkVersion 14/minSdkVersion 21/' "$F"
          sed -i 's/android:minSdkVersion="14"/android:minSdkVersion="21"/' "$M"
          sed -i "s#implementation 'com.github.omicronapps:7-Zip-JBinding-4Android:Release-16.02-2.03'#implementation('com.github.omicronapps:7-Zip-JBinding-4Android:Release-16.02-2.03') { transitive = false }#" "$F"
          grep -q "transitive = false" "$F" || { echo "PATCH FAILED: dependency line not found"; cat "$F"; exit 1; }
          grep -n "minSdkVersion\|7-Zip" "$F" "$M"

      - name: Point AGP 3.2.1 to SDK, NDK and CMake
        run: |
          cat > "$PROJECT_DIR/android/local.properties" <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/$NDK_VERSION
          cmake.dir=$ANDROID_HOME/cmake/$CMAKE_VERSION
          EOF

      - name: Build APK
        run: |
          set +e
          gradle -p "$PROJECT_DIR/android" --no-daemon assembleDebug > /tmp/build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "=========== ERROR SUMMARY ==========="
            sed -n '/FAILURE:/,/\* Try:/p' /tmp/build.log | head -40
            echo "=========== FIRST ERRORS ==========="
            grep -n -i -m 15 "error\|exception\|could not\|failed" /tmp/build.log
            MSG=$(sed -n '/What went wrong:/,/\* Try:/p' /tmp/build.log | head -8 | tr '\n' ' ' | cut -c1-600)
            echo "::error::$MSG"
          else
            tail -5 /tmp/build.log
          fi
          exit $CODE

      - name: Save full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
